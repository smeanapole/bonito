# Bonito Melchior CTC Model Configuration (DNA R10.4.1)
# Standard CTC loss with label smoothing

[model]
package = "bonito.melchior"
model_type = "ctc"

[labels]
labels = ["N", "A", "C", "G", "T"]

[input]
features = 1

[model_config]
in_channels = 1
embed_dim = 768
depth = 20
num_heads = 8
mlp_ratio = 4.0
drop_rate = 0.0
drop_path_rate = 0.1
output_length = 420
input_seq_len = 4096

[basecaller]
batchsize = 64
chunksize = 4096
overlap = 512

[optim]
weight_decay = 0.01

[lr_scheduler]
package = "bonito.schedule"
symbol = "linear_warmup_cosine_decay"
